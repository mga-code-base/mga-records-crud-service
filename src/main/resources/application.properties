# =======================================================
# SERVICE CONFIGURATION
# =======================================================
spring.application.name=mga-records-crud-service
logging.structured.format.console=${LOG_FORMAT:ecs}
server.port=8082

# =======================================================
# MONGO CONFIGURATION
# =======================================================
spring.mongodb.uri=${MONGODB_URI:}

# =======================================================
# EUREKA / DISCOVERY CONFIGURATION
# =======================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# =======================================================
# ACTUATORS CONFIGURATION
# =======================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.mongo.additional-commands={ "ping": 1 }

# =======================================================
# SPRING CLOUD LOAD BALANCER
# =======================================================
spring.cloud.loadbalancer.enabled=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.mvc.problemdetails.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.enabled=${TRACING_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability:4318/v1/traces}
management.otlp.metrics.export.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.data.mongodb.auto-index-creation=true
